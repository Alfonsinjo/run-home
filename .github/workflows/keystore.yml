name: Keystore erzeugen (einmalig)
on:
  workflow_dispatch:
    inputs:
      password:
        description: Passwort für Keystore und Key (merken!)
        required: true
permissions: {}
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: |
          keytool -genkeypair -v -keystore release.keystore -alias runhome -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.password }}" -keypass "${{ inputs.password }}" -dname "CN=Run Home, O=Run Home, C=DE"
          base64 -w0 release.keystore > keystore.b64
      - uses: actions/upload-artifact@v4
        with: { name: keystore, path: keystore.b64, retention-days: 3 }
      - run: echo "Artifact 'keystore' herunterladen, Inhalt von keystore.b64 als Secret ANDROID_KEYSTORE_BASE64 setzen, dazu ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS=runhome, ANDROID_KEY_PASSWORD."
